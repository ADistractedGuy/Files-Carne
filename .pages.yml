
media: media

content:
  - name: posts
    label: Publicações
    type: collection
    path: content/posts

    fields:
      - name: title
        label: Título do artigo
        type: string
        required: true

      - name: description
        label: Resumo
        type: text
        required: true

      - name: date
        label: Data de publicação
        type: date
        required: true

      - name: body
        label: Conteúdo completo
        type: rich-text
        required: true

